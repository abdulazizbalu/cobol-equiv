name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GNUCOBOL32_SHA256: 3bb48af46ced4779facf41fdc2ee60e4ccb86eaa99d010b36685315df39c2ee2

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        gnucobol: ["3.1.2", "3.2"]
    env:
      COBOL_EQUIV_REQUIRE_COBC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install GnuCOBOL 3.1.2 (Ubuntu package)
        if: matrix.gnucobol == '3.1.2'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol3
          cobc --version | head -1 | grep -F "cobc (GnuCOBOL) 3.1.2.0"
      - name: Install libgmp (needed to build and to run GnuCOBOL 3.2)
        if: matrix.gnucobol == '3.2'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
      - name: Cache GnuCOBOL 3.2 build
        if: matrix.gnucobol == '3.2'
        id: cache32
        uses: actions/cache@v4
        with:
          path: ~/gnucobol-3.2
          key: gnucobol-3.2-${{ env.GNUCOBOL32_SHA256 }}-ubuntu-24.04-${{ hashFiles('scripts/build-gnucobol-3.2.sh') }}
      - name: Build GnuCOBOL 3.2 from the pinned tarball
        if: matrix.gnucobol == '3.2' && steps.cache32.outputs.cache-hit != 'true'
        run: scripts/build-gnucobol-3.2.sh
      - name: Select GnuCOBOL 3.2
        if: matrix.gnucobol == '3.2'
        run: |
          echo "COBC=$HOME/gnucobol-3.2/bin/cobc" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH=$HOME/gnucobol-3.2/lib $HOME/gnucobol-3.2/bin/cobc --version | head -1 \
            | grep -F "cobc (GnuCOBOL) 3.2.0"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Fetch Track E sources (pinned URLs, checksums)
        run: python -m cobol_equiv.benchmark.fetch
      - name: Run tests
        env:
          COBOL_EQUIV_TRAP_COMPARISONS: "1"  # no CobDecimal comparison outside its tests (D14)
        run: python -m pytest -q

  reproduce:
    # Regenerates results/gnucobol-<version>/ from scratch and fails if
    # anything differs from the committed files (including SUMMARY.md and
    # the README results block, which are derived from all versions).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gnucobol: ["3.1.2", "3.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GnuCOBOL 3.1.2 (Ubuntu package)
        if: matrix.gnucobol == '3.1.2'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol3
          cobc --version | head -1 | grep -F "cobc (GnuCOBOL) 3.1.2.0"
      - name: Install libgmp (needed to build and to run GnuCOBOL 3.2)
        if: matrix.gnucobol == '3.2'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
      - name: Cache GnuCOBOL 3.2 build
        if: matrix.gnucobol == '3.2'
        id: cache32
        uses: actions/cache@v4
        with:
          path: ~/gnucobol-3.2
          key: gnucobol-3.2-${{ env.GNUCOBOL32_SHA256 }}-ubuntu-24.04-${{ hashFiles('scripts/build-gnucobol-3.2.sh') }}
      - name: Build GnuCOBOL 3.2 from the pinned tarball
        if: matrix.gnucobol == '3.2' && steps.cache32.outputs.cache-hit != 'true'
        run: scripts/build-gnucobol-3.2.sh
      - name: Select GnuCOBOL 3.2
        if: matrix.gnucobol == '3.2'
        run: |
          echo "COBC=$HOME/gnucobol-3.2/bin/cobc" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH=$HOME/gnucobol-3.2/lib $HOME/gnucobol-3.2/bin/cobc --version | head -1 \
            | grep -F "cobc (GnuCOBOL) 3.2.0"
      - name: Install package
        run: python -m pip install -e ".[dev]" -r requirements-repro.txt
      - name: Reproduce results
        run: python -m cobol_equiv.reproduce
      - name: Compare with committed results
        run: |
          git diff --exit-code -- results/ README.md
          test -z "$(git status --porcelain -- results/ README.md)"

  benchmark:
    timeout-minutes: 300
    # Regenerates the benchmark vectors with both compilers and fails if
    # they differ from the committed ones; checks that every reference
    # translation passes all its vectors (criterion E4) and that the API
    # sheet is the committed one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GnuCOBOL 3.1.2 (Ubuntu package) and libgmp
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol3 libgmp-dev
          cobc --version | head -1 | grep -F "cobc (GnuCOBOL) 3.1.2.0"
      - name: Cache GnuCOBOL 3.2 build
        id: cache32
        uses: actions/cache@v4
        with:
          path: ~/gnucobol-3.2
          key: gnucobol-3.2-${{ env.GNUCOBOL32_SHA256 }}-ubuntu-24.04-${{ hashFiles('scripts/build-gnucobol-3.2.sh') }}
      - name: Build GnuCOBOL 3.2 from the pinned tarball
        if: steps.cache32.outputs.cache-hit != 'true'
        run: scripts/build-gnucobol-3.2.sh
      - name: Install package
        run: python -m pip install -e ".[dev]" -r requirements-repro.txt
      - name: Fetch Track E sources (pinned URLs, checksums)
        run: python -m cobol_equiv.benchmark.fetch
      - name: API sheet is the committed one
        run: python -m cobol_equiv.benchmark.apisheet --check
      - name: Keep the committed vectors
        run: cp -r benchmark/vectors "$RUNNER_TEMP/committed-vectors"
      - name: Vectors, GnuCOBOL 3.1.2
        run: python -m cobol_equiv.benchmark.vectors --track E,R,T
      - name: Vectors, GnuCOBOL 3.2
        run: COBC=$HOME/gnucobol-3.2/bin/cobc python -m cobol_equiv.benchmark.vectors --track E,R,T
      - name: Compare with committed vectors (decompressed content)
        run: python -m cobol_equiv.benchmark.vectors --compare "$RUNNER_TEMP/committed-vectors"
      - name: Reference translations pass all vectors (E4)
        run: python -m cobol_equiv.benchmark.refcheck
      - name: Translation artifacts are consistent with the manifest
        run: python -m cobol_equiv.benchmark.audit
      - name: Comparison scan of the translations is the committed one (D14)
        run: python -m cobol_equiv.benchmark.eqscan --check
      - name: Verification inputs record is current
        run: python -m cobol_equiv.benchmark.ci inputs --check --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
      - name: Benchmark report is generated from the committed data
        run: python -m cobol_equiv.benchmark.analysis report --check

  verify:
    # Re-verifies the committed translations against the committed verdicts:
    # the units whose inputs changed since the base, plus a fixed sample of
    # the rest (docs/benchmark.md, "Verification in CI"). The full
    # re-verification of both runtime modes is benchmark-full.yml.
    timeout-minutes: 300
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [registered, corrected]
        track: [E, R]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]" -r requirements-repro.txt
      - name: Fetch Track E sources (pinned URLs, checksums)
        run: python -m cobol_equiv.benchmark.fetch
      - name: Restore saved verification units
        uses: actions/cache@v4
        with:
          path: benchmark/results/.verify-parts
          key: verify-${{ matrix.runtime }}-${{ matrix.track }}-${{ hashFiles('benchmark/results/verify-inputs.json', 'src/cobol_equiv/benchmark/*.py', 'src/cobol_equiv/runtime/*.py', '**/spec.py') }}-${{ github.run_id }}
          restore-keys: verify-${{ matrix.runtime }}-${{ matrix.track }}-
      - name: Changed units and a fixed sample reproduce the committed verdicts
        run: python -m cobol_equiv.benchmark.ci check --runtime ${{ matrix.runtime }} --track ${{ matrix.track }} --base "$BASE" --sample 2
        env:
          # push to main: the previous commit (squash merges); the weekly full
          # run covers what a multi-commit push would leave out
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
