name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GNUCOBOL32_SHA256: 3bb48af46ced4779facf41fdc2ee60e4ccb86eaa99d010b36685315df39c2ee2

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        gnucobol: ["3.1.2", "3.2"]
    env:
      COBOL_EQUIV_REQUIRE_COBC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install GnuCOBOL 3.1.2 (Ubuntu package)
        if: matrix.gnucobol == '3.1.2'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol3
          cobc --version | head -1 | grep -F "cobc (GnuCOBOL) 3.1.2.0"
      - name: Install libgmp (needed to build and to run GnuCOBOL 3.2)
        if: matrix.gnucobol == '3.2'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
      - name: Cache GnuCOBOL 3.2 build
        if: matrix.gnucobol == '3.2'
        id: cache32
        uses: actions/cache@v4
        with:
          path: ~/gnucobol-3.2
          key: gnucobol-3.2-${{ env.GNUCOBOL32_SHA256 }}-ubuntu-24.04-${{ hashFiles('scripts/build-gnucobol-3.2.sh') }}
      - name: Build GnuCOBOL 3.2 from the pinned tarball
        if: matrix.gnucobol == '3.2' && steps.cache32.outputs.cache-hit != 'true'
        run: scripts/build-gnucobol-3.2.sh
      - name: Select GnuCOBOL 3.2
        if: matrix.gnucobol == '3.2'
        run: |
          echo "COBC=$HOME/gnucobol-3.2/bin/cobc" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH=$HOME/gnucobol-3.2/lib $HOME/gnucobol-3.2/bin/cobc --version | head -1 \
            | grep -F "cobc (GnuCOBOL) 3.2.0"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  reproduce:
    # Regenerates results/gnucobol-<version>/ from scratch and fails if
    # anything differs from the committed files (including SUMMARY.md and
    # the README results block, which are derived from all versions).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gnucobol: ["3.1.2", "3.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GnuCOBOL 3.1.2 (Ubuntu package)
        if: matrix.gnucobol == '3.1.2'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol3
          cobc --version | head -1 | grep -F "cobc (GnuCOBOL) 3.1.2.0"
      - name: Install libgmp (needed to build and to run GnuCOBOL 3.2)
        if: matrix.gnucobol == '3.2'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
      - name: Cache GnuCOBOL 3.2 build
        if: matrix.gnucobol == '3.2'
        id: cache32
        uses: actions/cache@v4
        with:
          path: ~/gnucobol-3.2
          key: gnucobol-3.2-${{ env.GNUCOBOL32_SHA256 }}-ubuntu-24.04-${{ hashFiles('scripts/build-gnucobol-3.2.sh') }}
      - name: Build GnuCOBOL 3.2 from the pinned tarball
        if: matrix.gnucobol == '3.2' && steps.cache32.outputs.cache-hit != 'true'
        run: scripts/build-gnucobol-3.2.sh
      - name: Select GnuCOBOL 3.2
        if: matrix.gnucobol == '3.2'
        run: |
          echo "COBC=$HOME/gnucobol-3.2/bin/cobc" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH=$HOME/gnucobol-3.2/lib $HOME/gnucobol-3.2/bin/cobc --version | head -1 \
            | grep -F "cobc (GnuCOBOL) 3.2.0"
      - name: Install package
        run: python -m pip install -e ".[dev]" -r requirements-repro.txt
      - name: Reproduce results
        run: python -m cobol_equiv.reproduce
      - name: Compare with committed results
        run: |
          git diff --exit-code -- results/ README.md
          test -z "$(git status --porcelain -- results/ README.md)"
